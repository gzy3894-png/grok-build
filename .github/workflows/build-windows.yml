# Build Windows release of Grok Build TUI for personal fork use.
# No local compile required — download the artifact after CI finishes.

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - ui-zh
      - main
    paths:
      - "crates/codegen/xai-grok-pager/**"
      - "crates/codegen/xai-grok-pager-bin/**"
      - "crates/codegen/xai-grok-shell/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: windows-release
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT use repo bin/protoc (dotslash wrapper; not a Win32 PE).
      # Install a real protoc zip and point PROTOC at the .exe.
      - name: Install protoc (Windows zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "29.3"
          $zip = "protoc-$ver-win64.zip"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/$zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP $zip
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          $exe = Join-Path $dest "bin\protoc.exe"
          if (-not (Test-Path $exe)) { throw "protoc.exe missing after extract" }
          & $exe --version
          "PROTOC=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$dest\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-windows
          cache-on-failure: true

      # Workspace [profile.release] keeps debug=1 + strip=false for Linux/macOS
      # sidecars. On MSVC that blows past the PDB public-symbol limit (LNK4319).
      - name: Release build (pager bin)
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "PROTOC=$env:PROTOC"
          if (-not $env:PROTOC -or -not (Test-Path $env:PROTOC)) {
            throw "PROTOC not set to a real protoc.exe"
          }
          # Hide the repo's non-Windows bin/protoc so build scripts don't pick it.
          if (Test-Path "bin/protoc") {
            Rename-Item "bin/protoc" "protoc.dotslash.bak"
          }
          try {
            cargo build -p xai-grok-pager-bin --release
          } finally {
            if (Test-Path "bin/protoc.dotslash.bak") {
              Rename-Item "bin/protoc.dotslash.bak" "protoc"
            }
          }

      - name: Stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "target/release/xai-grok-pager.exe"
          if (-not (Test-Path $src)) {
            Get-ChildItem target/release -Filter *.exe | Select-Object Name, Length
            throw "missing $src"
          }
          Copy-Item $src dist/grok-app.exe
          Copy-Item $src dist/xai-grok-pager.exe
          Get-FileHash dist/grok-app.exe -Algorithm SHA256 | Format-List
          Get-Item dist/* | Format-Table Name, Length

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: grok-windows-x64
          path: |
            dist/grok-app.exe
            dist/xai-grok-pager.exe
          if-no-files-found: error
          retention-days: 14
